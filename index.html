<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY BET — Casino Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080808;color:#eee}
header{position:sticky;top:0;z-index:10;background:#090909;border-bottom:1px solid #4b3a12;padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900;color:#d6ad3a;letter-spacing:2px}.demo{border:1px solid #b28a25;color:#d8b65b;border-radius:20px;padding:9px 14px;font-size:12px}
.balance{margin:16px;border:1px solid #5d4615;border-radius:22px;padding:20px;background:linear-gradient(135deg,#171208,#0d0c09);text-align:center}
.balance small{color:#aaa}.balance strong{display:block;font-size:36px;color:#d8ae35;margin:5px}.add{background:#c79d35;border:0;border-radius:12px;padding:12px 18px;font-weight:800}
nav{display:flex;gap:10px;overflow:auto;padding:8px 16px}.tab{white-space:nowrap;border:1px solid #594719;background:#111;border-radius:14px;padding:12px 17px;color:#ddd}
.tab.active{background:#34280c;color:#e3b943}.section{padding:8px 16px}.section h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#121212;border:1px solid #30260e;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #000}
.art{height:145px;display:flex;align-items:center;justify-content:center;font-size:62px;background:radial-gradient(circle,#40300d,#15110a)}
.card h3{margin:12px 12px 4px;font-size:17px}.card p{margin:0 12px 12px;color:#999;font-size:12px}.play{margin:0 12px 14px;width:calc(100% - 24px);border:0;border-radius:12px;padding:12px;background:#c39a32;font-weight:800}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#171a22;border-top:1px solid #555;display:flex;justify-content:space-around;padding:9px 4px;z-index:10}.bottom button{background:none;border:0;color:#aaa;font-size:12px}.bottom b{display:block;color:#7cff73;font-size:20px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.open{display:flex}.box{width:min(430px,100%);background:#151515;border:1px solid #755817;border-radius:22px;padding:20px;text-align:center}.close{float:right;background:none;border:0;color:#aaa;font-size:24px}.wheel{font-size:75px;margin:20px}.result{font-size:22px;color:#e0b43e;min-height:30px}.action{background:#c39a32;border:0;border-radius:12px;padding:13px 20px;font-weight:800;margin:7px}
footer{height:75px}
</style>
</head>
<body>
<header><div class="logo">GY BET</div><div class="demo">CASINO DEMO</div></header>

<div class="balance">
  <small>Fichas virtuais</small><strong id="balance">10.100</strong>
  <button class="add" onclick="addChips()">+ 1.000 fichas</button>
</div>

<nav>
 <button class="tab active" onclick="filterGames('todos',this)">🎰 Cassino</button>
 <button class="tab" onclick="filterGames('roleta',this)">🎡 Roleta</button>
 <button class="tab" onclick="filterGames('blackjack',this)">🃏 Blackjack</button>
 <button class="tab" onclick="filterGames('baccarat',this)">♦️ Bacará</button>
</nav>

<section class="section">
<h2>🎰 Jogos de cassino</h2>
<div class="grid" id="games"></div>
</section>
<footer></footer>

<div class="modal" id="modal">
 <div class="box">
  <button class="close" onclick="closeGame()">×</button>
  <h2 id="gameTitle">Jogo Demo</h2>
  <div class="wheel" id="gameIcon">🎰</div>
  <div class="result" id="result">Pronto para jogar</div>
  <p style="color:#999">Modo demonstração — somente fichas virtuais.</p>
  <button class="action" onclick="play()">JOGAR</button>
  <button class="action" onclick="closeGame()">FECHAR</button>
 </div>
</div>

<div class="bottom">
 <button onclick="filterGames('todos')"><b>⌂</b>Hall</button>
 <button onclick="alert('Depósito desativado no modo demo.')"><b>▣</b>Depósito</button>
 <button onclick="alert('Agência disponível somente no modo demo.')"><b>●</b>Agência</button>
 <button onclick="alert('Promoções de demonstração.')"><b>🎁</b>Promoção</button>
 <button onclick="alert('Perfil demo')"><b>●</b>Perfil</button>
</div>

<script>
const games=[
 {name:'Fortune Tiger Demo',icon:'🐯',cat:'todos'},
 {name:'Fortune Rabbit Demo',icon:'🐰',cat:'todos'},
 {name:'Fortune Dragon Demo',icon:'🐉',cat:'todos'},
 {name:'Fortune Ox Demo',icon:'🐂',cat:'todos'},
 {name:'Pinata Wins Demo',icon:'🪅',cat:'todos'},
 {name:'Diamond Spin Demo',icon:'💎',cat:'todos'},
 {name:'Gates of Olympus Demo',icon:'⚡',cat:'todos'},
 {name:'Sweet Bonanza Demo',icon:'🍭',cat:'todos'},
 {name:'Roleta Demo',icon:'🎡',cat:'roleta'},
 {name:'Blackjack Demo',icon:'🃏',cat:'blackjack'},
 {name:'Bacará Demo',icon:'♦️',cat:'baccarat'},
 {name:'Lucky Spin Demo',icon:'🍀',cat:'todos'}
];
let current=null, balance=10100;
const el=id=>document.getElementById(id);
function render(list=games){
 el('games').innerHTML=list.map((g,i)=>`<article class="card">
 <div class="art">${g.icon}</div><h3>${g.name}</h3><p>Jogo totalmente simulado</p>
 <button class="play" onclick="openGame(${games.indexOf(g)})">Jogar Demo</button></article>`).join('');
}
function filterGames(cat,btn){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 if(btn)btn.classList.add('active');
 render(cat==='todos'?games:games.filter(g=>g.cat===cat));
 window.scrollTo({top:0,behavior:'smooth'});
}
function openGame(i){
 current=games[i];el('gameTitle').textContent=current.name;el('gameIcon').textContent=current.icon;
 el('result').textContent='Pronto para jogar';el('modal').classList.add('open');
}
function closeGame(){el('modal').classList.remove('open')}
function play(){
 if(balance<100){el('result').textContent='Você precisa de mais fichas virtuais.';return}
 balance-=100;
 const outcomes=['Você ganhou 250 fichas!','Você ganhou 150 fichas!','Não ganhou fichas desta vez.','Você ganhou 500 fichas!'];
 const r=outcomes[Math.floor(Math.random()*outcomes.length)];
 if(r.includes('ganhou')) balance += Number(r.match(/\d+/)[0]);
 el('balance').textContent=balance.toLocaleString('pt-BR');
 el('result').textContent=r;
}
function addChips(){balance+=1000;el('balance').textContent=balance.toLocaleString('pt-BR')}
render();
</script>
</body>
</html>
